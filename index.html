<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Lux Aristokrat QR Scanner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
:root{--bg:#070708;--card:#121214;--gold:#d4af37;--text:#f7edcf;--muted:#c6b083;}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,rgba(212,175,55,.12),transparent 35%),var(--bg);color:var(--text);font-family:Arial,sans-serif;padding:14px;}
.wrap{max-width:760px;margin:0 auto}
.hero{border:1px solid rgba(212,175,55,.22);border-radius:28px;background:linear-gradient(180deg,#171719,#0b0b0c);padding:18px;box-shadow:0 20px 55px rgba(0,0,0,.45)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:25px;font-weight:900;color:#f4df9a}
.sub{margin-top:8px;color:var(--muted);font-size:14px;line-height:1.35}
.btn{border:0;border-radius:18px;padding:14px 16px;font-weight:900;font-size:15px;cursor:pointer}
.gold{background:linear-gradient(180deg,#f4df9a,#d4af37);color:#1e1606}
.dark{background:#1b1b1d;color:var(--text);border:1px solid rgba(244,223,154,.18)}
.card{margin-top:14px;border:1px solid rgba(212,175,55,.22);background:#101012;border-radius:28px;padding:12px}
#reader{width:100%;min-height:520px;background:#000;border-radius:24px;overflow:hidden}
#reader video{width:100%!important;height:520px!important;object-fit:cover!important;filter:contrast(1.18) brightness(1.08) saturate(1.08)}
.status{margin-top:12px;padding:14px;border-radius:18px;background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.16);color:var(--text);font-size:14px;line-height:1.4;word-break:break-word}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.catalog{margin-top:14px;border-radius:22px;background:#111;border:1px solid rgba(212,175,55,.18);padding:14px}
.item{padding:12px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;gap:10px}
.item:last-child{border-bottom:0}
@media(max-width:480px){#reader{min-height:460px}#reader video{height:460px!important}.brand{font-size:21px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="top">
      <div>
        <div class="brand">Lux Aristokrat</div>
        <div class="sub">Сканируйте QR/Data Matrix, копите баллы и покупайте товары из каталога.</div>
      </div>
      <button class="btn dark" onclick="openCatalog()">Каталог</button>
    </div>
  </div>

  <div class="card">
    <div id="reader"></div>
    <div id="status" class="status">Нажмите “Запустить камеру”.</div>
    <div class="actions">
      <button class="btn gold" onclick="startScanner()">Запустить камеру</button>
      <button class="btn dark" onclick="stopScanner()">Остановить</button>
    </div>
  </div>

  <div id="catalog" class="catalog" style="display:none">
    <b style="color:#f4df9a">Каталог за баллы</b>
    <div class="item"><span>Скидка 10 000 сум</span><b>50 баллов</b></div>
    <div class="item"><span>Скидка 25 000 сум</span><b>120 баллов</b></div>
    <div class="item"><span>Подарок от Lux Aristokrat</span><b>250 баллов</b></div>
    <div class="item"><span>VIP скидка</span><b>500 баллов</b></div>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

let html5QrCode = null;
let running = false;
let lastCode = "";
let lastTime = 0;

function setStatus(txt){ document.getElementById("status").innerText = txt; }

function openCatalog(){
  const c = document.getElementById("catalog");
  c.style.display = c.style.display === "none" ? "block" : "none";
}

async function startScanner(){
  try{
    if(running) return;
    html5QrCode = new Html5Qrcode("reader", {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.DATA_MATRIX
      ],
      verbose:false
    });

    const config = {
      fps: 15,
      qrbox: function(viewfinderWidth, viewfinderHeight) {
        const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
        const size = Math.floor(minEdge * 0.92);
        return { width: size, height: size };
      },
      aspectRatio: 1.0,
      disableFlip: false,
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      videoConstraints: {
        facingMode: "environment",
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        focusMode: "continuous",
        advanced: [{ zoom: 1.8 }]
      }
    };

    await html5QrCode.start(
      { facingMode: "environment" },
      config,
      (decodedText) => {
        const now = Date.now();
        if(decodedText === lastCode && now - lastTime < 4000) return;
        lastCode = decodedText;
        lastTime = now;
        setStatus("QR найден: " + decodedText);
        if(tg){
          tg.sendData(decodedText);
          setTimeout(() => tg.close(), 400);
        }
      },
      () => {}
    );
    running = true;
    setStatus("Камера запущена. Наведите на QR/Data Matrix ближе и держите ровно.");
  }catch(e){
    setStatus("Ошибка камеры: " + e);
  }
}

async function stopScanner(){
  try{
    if(html5QrCode && running){
      await html5QrCode.stop();
      await html5QrCode.clear();
    }
  }catch(e){}
  running = false;
  setStatus("Камера остановлена.");
}
</script>
</body>
</html>
